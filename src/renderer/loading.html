<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhancing...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(28, 28, 30, 0.92);
      border-radius: 999px;
      padding: 12px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transform: translateY(8px);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .pill.visible {
      transform: translateY(0);
      opacity: 1;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
    }
    .pill.error .spinner {
      display: none;
    }
    .pill.error {
      background: rgba(200, 60, 60, 0.95);
    }
    .pill.error .label {
      color: #fff;
    }
    .pill.success .spinner {
      display: none;
    }
    .pill.success .label {
      color: #fff;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="spinner" aria-hidden="true"></div>
    <span class="label" id="label">Enhancing...</span>
  </div>
  <script>
    const pill = document.getElementById('pill');
    const label = document.getElementById('label');

    requestAnimationFrame(() => {
      pill.classList.add('visible');
    });

    if (window.electronAPI && window.electronAPI.window) {
      if (window.electronAPI.window.onSlideOut) {
        window.electronAPI.window.onSlideOut(() => {
          pill.classList.remove('visible');
        });
      }

      if (window.electronAPI.window.onShowError) {
        window.electronAPI.window.onShowError((message) => {
          pill.classList.add('error');
          label.textContent = message || 'Enhancement failed';
        });
      }

      if (window.electronAPI.window.onShowSuccess) {
        window.electronAPI.window.onShowSuccess((message) => {
          pill.classList.add('success');
          label.textContent = message || 'Copied to clipboard';
        });
      }
    }
  </script>
</body>
</html>
